name: Daily Player Stats Ingestion

on:
  schedule:
    # Runs daily in the early morning at 04:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Number of past days to check for recent matches (default: 3)'
        required: false
        default: '3'
      full_season:
        description: 'Set to "true" to re-check all matches across the 2026-27 season'
        required: false
        default: 'false'

jobs:
  ingest:
    name: Run Ingestion Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SOCCERDATA_DIR: /home/runner/soccerdata

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Soccerdata Directory
        uses: actions/cache@v4
        with:
          path: /home/runner/soccerdata
          key: soccerdata-cache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            soccerdata-cache-${{ runner.os }}-

      - name: Ensure TLS Library for Linux
        run: |
          BIN_DIR=$(python -c "import tls_requests.models.libraries as lib, os; os.makedirs(lib.BIN_DIR, exist_ok=True); print(lib.BIN_DIR)")
          curl -fsSL --retry 3 -o "${BIN_DIR}/tls-client-linux-ubuntu-amd64-1.13.1.so" "https://github.com/bogdanfinn/tls-client/releases/download/v1.13.1/tls-client-linux-ubuntu-amd64-1.13.1.so"
          python -c "import soccerdata as sd; print('Soccerdata ready')"

      - name: Run ESPN Daily Ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          FLAGS="--days ${{ github.event.inputs.lookback_days || '3' }}"
          if [ "${{ github.event.inputs.full_season }}" = "true" ]; then
            FLAGS="$FLAGS --all"
          fi
          python scripts/daily_update.py $FLAGS

      - name: Upload Daily Snapshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshots
          path: data/snapshots/
          retention-days: 90
