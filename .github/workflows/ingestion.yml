name: Daily Player Stats Ingestion

on:
  schedule:
    # Runs daily at 04:00 AM UTC
    - cron: '0 4 * * *'
  # Enables manual execution from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      limit_players:
        description: 'Number of top players to ingest (default: 25)'
        required: false
        default: '25'

jobs:
  ingest:
    name: Run Ingestion Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Schema Tests
        run: npm test

      - name: Run Stats Ingestion
        env:
          STRIKER_API_KEY: ${{ secrets.STRIKER_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          npm run ingest "" ${{ github.event.inputs.limit_players || '25' }}
